name: Code Quality

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for proper diffing
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Check code formatting
      run: npm run format:check || (echo "::error::Code is not properly formatted. Run 'npm run format' to fix." && exit 1)
    
    - name: Run ESLint
      run: npm run lint -- --format=stylish
    
    - name: Check for console.log statements
      # console.warn/error/info/debug are fine; console.log needs an
      # eslint-disable comment (debugger.js and tape.js are console tools
      # and carry a file-level disable).
      run: npx eslint src --rule '{"no-console":["error",{"allow":["warn","error","info","debug"]}]}'
    
    - name: Check test coverage
      # jest enforces the coverageThreshold in jest.config.js and exits
      # non-zero when it is not met — no fragile output parsing needed.
      run: npm test -- --coverage --coverageReporters=text-summary
    
    - name: Check bundle size
      run: |
        npm run build
        echo "Bundle sizes:"
        ls -lh dist/
        
        # Check if main bundle exceeds limit
        MAIN_SIZE=$(stat -c%s dist/zxgeneration.umd.min.js 2>/dev/null || stat -f%z dist/zxgeneration.umd.min.js)
        MAX_SIZE=524288  # 512KB
        
        if [ "$MAIN_SIZE" -gt "$MAX_SIZE" ]; then
          echo "::error::Main bundle size exceeds 512KB limit (current: $MAIN_SIZE bytes)"
          exit 1
        fi
    
    - name: Security audit
      run: npm audit --audit-level=high
    
    - name: License check
      run: |
        # Simple check for license headers in source files
        for file in $(find src -name "*.js"); do
          if ! head -n 5 "$file" | grep -q -E "(MIT|License|Copyright)" && ! grep -q "@jest-environment" "$file"; then
            echo "::warning file=$file::Missing license header"
          fi
        done